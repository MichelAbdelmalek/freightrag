[project]
name = "freightrag-answer"
version = "0.1.0"
description = "FreightRAG answer service: retrieve, guard, prompt, generate, validate."
requires-python = "==3.14.*"
# Exact pins: stable releases published at least two weeks before adoption (same rule as the .NET side and evals/).
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false   # a service run from source, not a library to publish
# The two-week rule for EVERY package, transitive ones included: resolution ignores anything newer.
# Move this date forward deliberately when updating dependencies (then re-run `uv lock`).
exclude-newer = "2026-11-06T00:00:00Z"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

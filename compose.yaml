# FreightRAG: the whole stack in one file.
#
#   docker compose up -d --build --wait     database, Ollama, model pulls, migration, extract, api, answer
#
# Postgres and Ollama are services here (published on 127.0.0.1:55432 and 127.0.0.1:11434 for your own tools); the app
# reaches them by service name over the compose network. Their data lives in the named volumes freightrag-pgdata and
# freightrag-ollama, which survive `docker compose down` (only `down -v` removes them).
# One-off tools (tests, ingest, docs, evals, user-secrets) sit behind profiles: `docker compose run --rm <name>` still works.
name: freightrag

x-sdk-image: &sdk-image mcr.microsoft.com/dotnet/sdk:10.0.403-noble@sha256:212fe4cb74627d5adf9817a4088906ae3edff1bd853bb27565d4b46731efe61e

services:
  # Postgres 17 + pgvector. The password comes from a file secret (secrets/db_password, see README step 1) and is only
  # used when the volume is empty; an existing volume keeps its own password.
  db:
    image: pgvector/pgvector:0.8.0-pg17@sha256:40b404964359299eefdd5f8518facf1886c562848cf4de13b6eaf91cb70c2b87
    restart: unless-stopped
    environment:
      POSTGRES_USER: freightrag
      POSTGRES_DB: freightrag
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    ports:
      # Localhost only.
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freightrag -d freightrag"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Ollama: embeddings (nomic-embed-text) and the chat model. CPU only here; a GPU needs a device reservation.
  ollama:
    image: ollama/ollama:0.30.9@sha256:1a72f129b5f18e4552a15fb9356c23c16513aa54400b9538897990fb597b5df2
    restart: unless-stopped
    ports:
      # Localhost only.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: pulls the models once (a no-op when they are already in the volume). The first run downloads about 5.5 GB.
  models:
    image: ollama/ollama:0.30.9@sha256:1a72f129b5f18e4552a15fb9356c23c16513aa54400b9538897990fb597b5df2
    environment:
      OLLAMA_HOST: ollama:11434
      EMBEDDING_MODEL: nomic-embed-text
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:8b}
    entrypoint: ["/bin/sh", "-c", "ollama pull $$EMBEDDING_MODEL && ollama pull $$CHAT_MODEL"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    depends_on:
      ollama:
        condition: service_healthy

  # docker compose run --rm tests
  tests:
    profiles: ["tools"]
    build:
      context: .
      target: test

  # docker compose run --rm ingest
  ingest:
    profiles: ["tools"]
    build:
      context: .
      target: ingest
    volumes:
      # Documents, read-only.
      - ./data:/data:ro
      # ONLY this project's User Secrets folder (not your other projects'), read-only.
      - ${HOME}/.microsoft/usersecrets/bc38a00e-bd57-4c78-9333-1f52ff1438ed:/home/app/.microsoft/usersecrets/bc38a00e-bd57-4c78-9333-1f52ff1438ed:ro
    extra_hosts:
      # Docker Desktop provides this name already; the mapping makes it work on Linux too.
      - "host.docker.internal:host-gateway"
    environment:
      # Non-secret settings only; the password still comes from User Secrets (the app refuses it anywhere else).
      Database__Host: db
      Database__Port: "5432"
      Ollama__Url: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      models:
        condition: service_completed_successfully

  # docker compose run --rm migrate   (applies the EF Core migrations to the database in appsettings.json)
  migrate:
    build:
      context: .
      target: migrate
    volumes:
      # ONLY this project's User Secrets folder (database password), read-only.
      - ${HOME}/.microsoft/usersecrets/bc38a00e-bd57-4c78-9333-1f52ff1438ed:/home/app/.microsoft/usersecrets/bc38a00e-bd57-4c78-9333-1f52ff1438ed:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Non-secret settings only; the password still comes from User Secrets (the app refuses it anywhere else).
      Database__Host: db
      Database__Port: "5432"
      Ollama__Url: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy

  # docker compose run --build --rm integration-tests
  # Real pgvector, hand-made vectors, no Ollama. Starts the throwaway testdb below automatically.
  integration-tests:
    profiles: ["integration"]
    build:
      context: .
      target: integration-test
    environment:
      FREIGHTRAG_TEST_DB: "Host=testdb;Username=postgres;Database=postgres"
    networks: [freightrag-net]
    depends_on:
      testdb:
        condition: service_healthy

  # Throwaway database for the integration tests: same pgvector image as the real one (pinned by digest),
  # data in memory (tmpfs), no published port, only reachable on the internal freightrag-net network.
  # Trust authentication is acceptable ONLY because of that isolation, and it means no test password exists.
  testdb:
    profiles: ["integration"]
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    networks: [freightrag-net]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # docker compose up api   →  http://localhost:8080/scalar/v1
  api:
    build:
      context: .
      target: api
    ports:
      # Bound to localhost only: the API keys travel over plain HTTP.
      - "127.0.0.1:8080:8080"
    volumes:
      # ONLY this project's User Secrets folder (password + API keys), read-only.
      - ${HOME}/.microsoft/usersecrets/bc38a00e-bd57-4c78-9333-1f52ff1438ed:/home/app/.microsoft/usersecrets/bc38a00e-bd57-4c78-9333-1f52ff1438ed:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # default (database, Ollama) plus the internal network that reaches the PDF extractor.
    networks: [default, extract-net]
    environment:
      # Non-secret settings only; the password still comes from User Secrets (the app refuses it anywhere else).
      Database__Host: db
      Database__Port: "5432"
      Ollama__Url: http://ollama:11434
    depends_on:
      migrate:
        condition: service_completed_successfully
      models:
        condition: service_completed_successfully
      extract:
        condition: service_healthy
    healthcheck:
      # The runtime image has no curl: a plain HTTP request over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # PDF extractor: reads the text layer of a PDF and runs OCR (Tesseract) on scanned pages. docker compose up -d extract api
  # Untrusted PDFs are parsed here, away from the API (which holds the database password). Internal network only: no
  # internet, no host access, no published port. Hard memory and CPU caps. Start it only when you need PDFs: with qwen3:8b
  # loaded the Docker VM has little room to spare.
  extract:
    build:
      context: ./extract
      target: app
    networks: [extract-net]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Unit tests of the extractor, including OCR accuracy on synthetic scans of data/*.txt (no network):
  #   docker compose --profile extract run --build --rm extract-tests
  extract-tests:
    profiles: ["extract"]
    build:
      context: ./extract
      target: test
      additional_contexts:
        data: ./data
    network_mode: none

  # docker compose up docs  →  http://localhost:8081  (local preview of the documentation site)
  docs:
    profiles: ["tools"]
    build:
      context: .
      target: docs
    command: ["dotnet", "docfx", "serve", "docs/_site", "--hostname", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8081:8080"

  # Retrieval evaluation (Python). Needs the API running: docker compose up -d api
  #   docker compose --profile eval run --build --rm retrieval-eval [--mode vector|keyword|hybrid | --compare]
  # The API keys are passed through BY NAME from your shell (values never in this file); see evals/README.md.
  # Default network, so it reaches the API as http://api:8080 (freightrag-net is internal and only for testdb).
  retrieval-eval:
    profiles: ["eval"]
    build:
      context: ./evals
      target: app
    # An entrypoint (not a command), so arguments after the service name are passed to the script.
    entrypoint: ["python", "run_retrieval_eval.py"]
    environment:
      - FREIGHTRAG_API_URL=http://api:8080
      - FREIGHTRAG_API_KEY_TENANT_NILE_FREIGHT
      - FREIGHTRAG_API_KEY_TENANT_DELTA_HAUL
    volumes:
      - ./evals/results:/evals/results
    depends_on:
      api:
        condition: service_started

  # Answer service (Python): search -> guard -> prompt -> generate -> validate. http://127.0.0.1:8090
  #   docker compose up -d --build answer      (starts the api too; needs Ollama with the chat model pulled)
  # No secrets are mounted: the caller's API key is forwarded to the search API and never stored or logged.
  # Override the model with CHAT_MODEL / NUM_CTX from your shell (passed by name, see answer/README.md).
  answer:
    build:
      context: ./answer
      target: app
    ports:
      # Localhost only: the API key travels over plain HTTP.
      - "127.0.0.1:8090:8090"
    environment:
      - SEARCH_API_URL=http://api:8080
      - OLLAMA_URL=http://ollama:11434
      - CHAT_MODEL
      - NUM_CTX
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy
      models:
        condition: service_completed_successfully

  # Unit tests of the answer service (fakes, no network): docker compose --profile answer run --build --rm answer-tests
  answer-tests:
    profiles: ["answer"]
    build:
      context: ./answer
      target: app
    command: ["pytest", "-q", "-p", "no:cacheprovider"]

  # Answer-quality evaluation (Python): generate answers, then judge them. See evals/README.md.
  #   docker compose --profile eval run --rm answer-eval generate [--limit N | --ids q01,q05]
  #   docker compose --profile eval run --rm answer-eval judge results/answers-<UTC>.json [--skip-faithfulness]
  #   docker compose --profile eval run --rm answer-eval calibrate
  # Tenant keys and the JUDGE_* settings are passed BY NAME from your shell (values never in this file). The default
  # judge is local Ollama (qwen3:8b); a hosted judge needs JUDGE_PROVIDER=openai, JUDGE_BASE_URL, JUDGE_MODEL and
  # JUDGE_API_KEY. DeepEval telemetry, .env loading and disk writes are switched off in evals/Dockerfile.
  answer-eval:
    profiles: ["eval"]
    build:
      context: ./evals
      target: app
    entrypoint: ["python", "run_answer_eval.py"]
    environment:
      - FREIGHTRAG_ANSWER_URL=http://answer:8090
      - FREIGHTRAG_API_URL=http://api:8080
      - FREIGHTRAG_API_KEY_TENANT_NILE_FREIGHT
      - FREIGHTRAG_API_KEY_TENANT_DELTA_HAUL
      - JUDGE_PROVIDER
      - JUDGE_MODEL
      - JUDGE_BASE_URL
      - JUDGE_API_KEY
      - JUDGE_TIMEOUT_S
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./evals/results:/evals/results
    depends_on:
      answer:
        condition: service_started

  # Unit tests of the eval logic (no network): docker compose --profile eval run --build --rm retrieval-eval-tests
  retrieval-eval-tests:
    profiles: ["eval"]
    build:
      context: ./evals
      target: app
    command: ["pytest", "-q", "-p", "no:cacheprovider"]

  # Runs the `dotnet user-secrets` tool from the SDK image, so no SDK is needed on the host.
  # See README for the exact command (the password is passed on stdin, not as an argument).
  user-secrets:
    profiles: ["tools"]
    image: *sdk-image
    user: app
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    entrypoint: ["dotnet", "user-secrets", "--id", "bc38a00e-bd57-4c78-9333-1f52ff1438ed"]
    volumes:
      # ONLY this project's secrets folder, so the tool can't touch other projects' secrets.
      - ${HOME}/.microsoft/usersecrets/bc38a00e-bd57-4c78-9333-1f52ff1438ed:/home/app/.microsoft/usersecrets/bc38a00e-bd57-4c78-9333-1f52ff1438ed

secrets:
  # Used only to initialise an empty database volume. Create it once from your User Secrets (README, step 1).
  db_password:
    file: ./secrets/db_password

volumes:
  pgdata:
    name: freightrag-pgdata
  ollama:
    name: freightrag-ollama

networks:
  # Internal: only the API and the PDF extractor are on it. The extractor cannot reach the internet or the host.
  extract-net:
    name: freightrag-extract-net
    internal: true
  # Internal: containers on it can talk to each other but not to the internet or the host.
  freightrag-net:
    name: freightrag-net
    internal: true

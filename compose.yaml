# FreightRAG tooling. Postgres and Ollama already run in their own containers on the host
# (127.0.0.1:55432 and 127.0.0.1:11434); the app reaches them via host.docker.internal.
name: freightrag

x-sdk-image: &sdk-image mcr.microsoft.com/dotnet/sdk:10.0.403-noble@sha256:212fe4cb74627d5adf9817a4088906ae3edff1bd853bb27565d4b46731efe61e

services:
  # docker compose run --rm tests
  tests:
    build:
      context: .
      target: test

  # docker compose run --rm ingest
  ingest:
    build:
      context: .
      target: ingest
    volumes:
      # Documents, read-only.
      - ./data:/data:ro
      # ONLY this project's User Secrets folder (not your other projects'), read-only.
      - ${HOME}/.microsoft/usersecrets/bc38a00e-bd57-4c78-9333-1f52ff1438ed:/home/app/.microsoft/usersecrets/bc38a00e-bd57-4c78-9333-1f52ff1438ed:ro
    extra_hosts:
      # Docker Desktop provides this name already; the mapping makes it work on Linux too.
      - "host.docker.internal:host-gateway"

  # docker compose run --rm migrate   (applies the EF Core migrations to the database in appsettings.json)
  migrate:
    build:
      context: .
      target: migrate
    volumes:
      # ONLY this project's User Secrets folder (database password), read-only.
      - ${HOME}/.microsoft/usersecrets/bc38a00e-bd57-4c78-9333-1f52ff1438ed:/home/app/.microsoft/usersecrets/bc38a00e-bd57-4c78-9333-1f52ff1438ed:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # docker compose run --build --rm integration-tests
  # Real pgvector, hand-made vectors, no Ollama. Starts the throwaway testdb below automatically.
  integration-tests:
    profiles: ["integration"]
    build:
      context: .
      target: integration-test
    environment:
      FREIGHTRAG_TEST_DB: "Host=testdb;Username=postgres;Database=postgres"
    networks: [freightrag-net]
    depends_on:
      testdb:
        condition: service_healthy

  # Throwaway database for the integration tests: same pgvector image as the real one (pinned by digest),
  # data in memory (tmpfs), no published port, only reachable on the internal freightrag-net network.
  # Trust authentication is acceptable ONLY because of that isolation, and it means no test password exists.
  testdb:
    profiles: ["integration"]
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    networks: [freightrag-net]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # docker compose up api   →  http://localhost:8080/scalar/v1
  api:
    build:
      context: .
      target: api
    ports:
      # Bound to localhost only: the API keys travel over plain HTTP.
      - "127.0.0.1:8080:8080"
    volumes:
      # ONLY this project's User Secrets folder (password + API keys), read-only.
      - ${HOME}/.microsoft/usersecrets/bc38a00e-bd57-4c78-9333-1f52ff1438ed:/home/app/.microsoft/usersecrets/bc38a00e-bd57-4c78-9333-1f52ff1438ed:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # docker compose up docs  →  http://localhost:8081  (local preview of the documentation site)
  docs:
    build:
      context: .
      target: docs
    command: ["dotnet", "docfx", "serve", "docs/_site", "--hostname", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8081:8080"

  # Retrieval evaluation (Python). Needs the API running: docker compose up -d api
  #   docker compose --profile eval run --build --rm retrieval-eval
  # The API keys are passed through BY NAME from your shell (values never in this file); see evals/README.md.
  # Default network, so it reaches the API as http://api:8080 (freightrag-net is internal and only for testdb).
  retrieval-eval:
    profiles: ["eval"]
    build:
      context: ./evals
      target: app
    environment:
      - FREIGHTRAG_API_URL=http://api:8080
      - FREIGHTRAG_API_KEY_TENANT_NILE_FREIGHT
      - FREIGHTRAG_API_KEY_TENANT_DELTA_HAUL
    volumes:
      - ./evals/results:/evals/results
    depends_on:
      api:
        condition: service_started

  # Unit tests of the eval logic (no network): docker compose --profile eval run --build --rm retrieval-eval-tests
  retrieval-eval-tests:
    profiles: ["eval"]
    build:
      context: ./evals
      target: app
    command: ["pytest", "-q", "-p", "no:cacheprovider"]

  # Runs the `dotnet user-secrets` tool from the SDK image, so no SDK is needed on the host.
  # See README for the exact command (the password is passed on stdin, not as an argument).
  user-secrets:
    profiles: ["tools"]
    image: *sdk-image
    user: app
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    entrypoint: ["dotnet", "user-secrets", "--id", "bc38a00e-bd57-4c78-9333-1f52ff1438ed"]
    volumes:
      # ONLY this project's secrets folder, so the tool can't touch other projects' secrets.
      - ${HOME}/.microsoft/usersecrets/bc38a00e-bd57-4c78-9333-1f52ff1438ed:/home/app/.microsoft/usersecrets/bc38a00e-bd57-4c78-9333-1f52ff1438ed

networks:
  # Internal: containers on it can talk to each other but not to the internet or the host.
  # Your existing freightrag-db / freightrag-ollama containers are not attached to it.
  freightrag-net:
    name: freightrag-net
    internal: true

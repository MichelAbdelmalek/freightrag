<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FreightRAG REST API</title>
  </head>
  <body>
    <!--
      Interactive reference rendered from ../openapi/v1.json (the committed OpenAPI document that the
      test suite keeps identical to what the API serves). Scalar is pinned to an exact version and
      protected by Subresource Integrity: if the CDN served different bytes, the browser would refuse
      to run them. The bundle is self-contained (it loads no further scripts).
    -->
    <script id="api-reference" data-url="../openapi/v1.json"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.77.0/dist/browser/standalone.js"
      integrity="sha384-+7ESN8b9Ljg46TCYKedZUlhF/wfZbOt78aV/DtoU3anEElh8Q2eXsyhQ9W5lAZD4"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"></script>
  </body>
</html>

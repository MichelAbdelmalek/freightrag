# Keeps pinned dependencies current. The 14-day cooldown matches this repo's rule:
# adopt only releases that have been public for at least two weeks.
# Major versions are ignored so the project stays on .NET 10 (LTS) until we decide to move.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns: ["*"]

  # .NET tools in .config/dotnet-tools.json (docfx, dotnet-ef — keep dotnet-ef aligned with the EF Core packages).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dotnet-tools:
        patterns: ["*"]

  # .NET SDK/runtime base images in the Dockerfile (security patches for the published image).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dotnet-images:
        patterns: ["*"]

  # Images in compose.yaml: the SDK image of the user-secrets service and the pgvector image of the integration
  # tests' testdb (also used by CI, which runs the integration tests through compose).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The SDK version pinned in global.json.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Python eval project (evals/pyproject.toml + uv.lock). Note: pyproject's [tool.uv] exclude-newer date enforces the
  # two-week rule for every package, and it AGES: keep it at about now minus 14 days (see evals/README.md). If it lags,
  # this job fails ("no version of X") for releases newer than the cutoff but past the cooldown. Moving it forward
  # installs nothing by itself; accepting an update means Dependabot's PR plus `uv lock`.
  - package-ecosystem: uv
    directory: /evals
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]

  # Python answer service (answer/pyproject.toml + uv.lock). Same exclude-newer rule as evals/.
  - package-ecosystem: uv
    directory: /answer
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-answer:
        patterns: ["*"]

  # Base images of answer/Dockerfile (Python, uv).
  - package-ecosystem: docker
    directory: /answer
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Same reason as evals/: a new Python minor must change image, requires-python, .python-version and uv.lock together.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]

  # Python PDF extractor (extract/pyproject.toml + uv.lock). Same exclude-newer rule as answer/.
  - package-ecosystem: uv
    directory: /extract
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-extract:
        patterns: ["*"]

  # Base images of extract/Dockerfile (Python, uv). The Tesseract apt pins in it are bumped by hand.
  - package-ecosystem: docker
    directory: /extract
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]

  # Base images of evals/Dockerfile (Python, uv).
  - package-ecosystem: docker
    directory: /evals
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # A new Python minor (3.14 → 3.15) must change the image, requires-python, .python-version and uv.lock together
      # — a deliberate change, not an image-only bump (that broke CI once).
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]

[project]
name = "freightrag-eval"
version = "0.1.0"
description = "Retrieval evaluation for FreightRAG: recall@k and MRR against the search API."
requires-python = "==3.14.*"
# Exact pins: stable releases published at least two weeks before adoption (same rule as the .NET side).
dependencies = [
    "httpx==0.28.1",
    # LLM-judged faithfulness for the answer evaluation. Used only here (never in a service); it brings a large
    # dependency tree, all pinned by uv.lock and held to exclude-newer below.
    "deepeval==4.3.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false   # a set of scripts, not a library to publish
# The two-week rule for EVERY package, transitive ones included: resolution ignores anything newer.
# The cutoff ages: keep it at about now minus 14 days. Moving it only makes newer releases eligible; it changes no
# installed version by itself (accepting an update still means a Dependabot PR and `uv lock`).
exclude-newer = "2026-11-07T17:00:00Z"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# deepeval and its pytest dependencies register pytest plugins that load in every run. Our tests need none of them,
# and deepeval's plugin is the one thing here that could talk to a cloud service.
filterwarnings = [
    "ignore::DeprecationWarning:deepeval.*",   # third-party noise from DeepEval's own code
    "ignore::SyntaxWarning:deepeval.*",
]
addopts = "-p no:deepeval -p no:xdist -p no:rerunfailures -p no:repeat -p no:anyio -p no:asyncio"
